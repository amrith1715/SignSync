services:
  api:
    build: .
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      SIGNSYNC_ALLOWED_ORIGINS: ${SIGNSYNC_ALLOWED_ORIGINS:?Set the Vercel website origin in .env}
    expose:
      - "8001"

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the API DNS name in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
